[project]
name = "bioemu-saxs-campaign"
version = "0.1.0"
description = "Where BioEmu-1 disagrees with solution scattering, and which proteins to measure next"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "mdtraj>=1.10",
    "requests>=2.32",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "mrcfile>=1.5",
]

[project.scripts]
bsc = "bsc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# the campaign proposal is a Markdown template with table rows that must stay on one line
"src/bsc/report.py" = ["E501"]
"docs/site/build.py" = ["E501"]
