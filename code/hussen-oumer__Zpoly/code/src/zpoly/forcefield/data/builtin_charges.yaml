# Built-in RESP charges (rqm/forcefield/builtin_charges.md), unscaled.
# Source: the group's OPLS-AA topologies (12-mers, ionic groups scaled by 0.85): RESP of the
# methacrylate/acrylate/acrylamide linker, the cation (N+ and its 4 carbons) and the anion (CH2-SO3-)
# fragments; the backbone and the CH2 groups between them keep the force field's charges.
# Atom names are the software's (the same in the F, R and E residues).
