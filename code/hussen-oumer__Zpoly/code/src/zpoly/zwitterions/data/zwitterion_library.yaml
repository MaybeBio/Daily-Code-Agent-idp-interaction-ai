# rq-14c6b03b rq-b184f495 rq-32c147ad rq-9b2b9d78 rq-e283b2ae
# Built-in zwitterion library for zpoly.
# Single source of truth for docs/zwitterion_catalog.md (regenerate with
# devtools/build_zwitterion_catalog.py). Schema: rqm/zwitterion_library.md.
version: 1
blocks:
  polymerizable:
    MA:
      name: Methacrylate ester
      smiles: C=C(C)C(=O)O[*:2]
      smarts: '[CH2]=[CX3]([CH3])C(=O)O[CX4]'
      notes: alpha-methyl; DMAPS/SBMA, MPC, CBMA
    AE:
      name: Acrylate ester
      smiles: C=CC(=O)O[*:2]
      smarts: '[CH2]=[CH1]C(=O)O[CX4]'
      notes: no alpha-methyl; A3367
    MAm:
      name: Methacrylamide
      smiles: C=C(C)C(=O)N[*:2]
      smarts: '[CH2]=[CX3]([CH3])C(=O)[NH1][CX4]'
      notes: hydrolysis-resistant; SPP, CBMAA
    AAm:
      name: Acrylamide
      smiles: C=CC(=O)N[*:2]
      smarts: '[CH2]=[CH1]C(=O)[NH1][CX4]'
      notes: SBAA/A3361, CBAA
    St:
      name: 4-Vinylphenyl (styrenic)
      smiles: C=Cc1ccc([*:2])cc1
      smarts: '[CH2]=[CH1]c1ccc([CH2])cc1'
      notes: used with a benzyl CH2 linker
    V:
      name: Vinyl on an aromatic cation
      smiles: C=C[*:2]
      smarts: '[CH2]=[CH1][c,n]'
      notes: vinylpyridinium / N-vinylimidazolium; the cation ring is attached directly
    Al:
      name: Allyl (diallyl cyclopolymerization)
      smiles: C=CC[*:2]
      smarts: '[CH2]=[CH1][CH2][NX4+][CH2][CH1]=[CH2]'
      notes: ring-forming backbone; NOT a simple vinyl addition
  linker: {}
  cation:
    NMe2:
      name: Dimethylammonium (quaternary)
      smiles: '[*:1][N+](C)(C)[*:2]'
      smarts: '[CH3][NX4+]([CH3])([CH2])[CH2]'
      notes: DMAPS/SBMA, CBMA; most common
    NEt2:
      name: Diethylammonium (quaternary)
      smiles: '[*:1][N+](CC)(CC)[*:2]'
      smarts: '[CH3][CH2][NX4+]([CH2][CH3])([CH2])[CH2]'
      notes: bulkier, more hydrophobic
    Pyr:
      name: Pyrrolidinium
      smiles: '[*:1][N+]1([*:2])CCCC1'
      smarts: '[NX4+]1[CH2][CH2][CH2][CH2]1'
      notes: cyclic ammonium
    Pip:
      name: Piperidinium
      smiles: '[*:1][N+]1([*:2])CCCCC1'
      smarts: '[NX4+]1[CH2][CH2][CH2][CH2][CH2]1'
      notes: cyclic ammonium
    Mor:
      name: Morpholinium
      smiles: '[*:1][N+]1([*:2])CCOCC1'
      smarts: '[NX4+]1[CH2][CH2]O[CH2][CH2]1'
      notes: cyclic ammonium with ether O; more hydrophilic
    NMeAl:
      name: Methyl(allyl)ammonium
      smiles: '[*:1][N+](C)(CC=C)[*:2]'
      smarts: '[CH3][NX4+]([CH2][CH1]=[CH2])([CH2])[CH2]'
      notes: second allyl arm of the diallyl monomer
    Im:
      name: Imidazolium (1,3-disubstituted)
      smiles: '[*:1]n1cc[n+]([*:2])c1'
      smarts: '[#6]n1cc[n+]([#6])c1'
      notes: aromatic, delocalized +1
    Py2:
      name: Pyridinium (N-alkyl, 2-substituted)
      smiles: '[*:1]c1cccc[n+]1[*:2]'
      smarts: '[#6][n+]1c([#6])cccc1'
      notes: from 2-vinylpyridine
    Py4:
      name: Pyridinium (N-alkyl, 4-substituted)
      smiles: '[*:1]c1cc[n+]([*:2])cc1'
      smarts: '[#6][n+]1ccc([#6])cc1'
      notes: from 4-vinylpyridine
    PBu2:
      name: Dibutylphosphonium
      smiles: '[*:1][P+](CCCC)(CCCC)[*:2]'
      smarts: '[PX4+]'
      notes: phosphonium betaines
    SMe:
      name: Methylsulfonium
      smiles: '[*:1][S+](C)[*:2]'
      smarts: '[SX3+]'
      notes: rare
    NMe3:
      name: Trimethylammonium (terminal)
      smiles: '[*:1][N+](C)(C)C'
      smarts: '[CH3][NX4+]([CH3])([CH3])[CH2]'
      notes: chain end; phosphorylcholine (MPC)
    'NO':
      name: Amine N-oxide (N+-O-, both charges)
      smiles: '[*:1][N+](C)(C)[O-]'
      smarts: '[NX4+][OX1-]'
      notes: the whole zwitterion in one group; TMAO-like
    NMePh:
      name: Methyl(phenyl)ammonium
      smiles: '[*:1][N+](C)(c1ccccc1)[*:2]'
      smarts: '[CH3][NX4+](c)([CH2])[CH2]'
      notes: ZB5; strongest synthesized ZB-ZB attraction
    NPh2:
      name: Diphenylammonium
      smiles: '[*:1][N+](c1ccccc1)(c1ccccc1)[*:2]'
      smarts: '[NX4+](c)(c)([CH2])[CH2]'
      notes: M2
    NBn2:
      name: Dibenzylammonium
      smiles: '[*:1][N+](Cc1ccccc1)(Cc1ccccc1)[*:2]'
      smarts: '[NX4+]([CH2]c)([CH2]c)([CH2])[CH2]'
      notes: from Schneider et al. M5 (that monomer is not in the library)
    NMOM2:
      name: Bis(methoxymethyl)ammonium
      smiles: '[*:1][N+](COC)(COC)[*:2]'
      smarts: '[NX4+]([CH2]O[CH3])([CH2]O[CH3])'
      notes: M6
    NMeDFE:
      name: Methyl(2,2-difluoroethyl)ammonium
      smiles: '[*:1][N+](C)(CC(F)F)[*:2]'
      smarts: '[CH3][NX4+][CH2][CH1](F)F'
      notes: M8
    NMeMCM:
      name: Methyl(methoxycarbonylmethyl)ammonium
      smiles: '[*:1][N+](C)(CC(=O)OC)[*:2]'
      smarts: '[CH3][NX4+][CH2]C(=O)O[CH3]'
      notes: M9
    NAcOM2:
      name: Bis(acetoxymethyl)ammonium
      smiles: '[*:1][N+](COC(C)=O)(COC(C)=O)[*:2]'
      smarts: '[NX4+]([CH2]OC(=O)[CH3])[CH2]OC(=O)[CH3]'
      notes: M10
    NMCM2:
      name: Bis(methoxycarbonylmethyl)ammonium
      smiles: '[*:1][N+](CC(=O)OC)(CC(=O)OC)[*:2]'
      smarts: '[NX4+]([CH2]C(=O)O[CH3])[CH2]C(=O)O[CH3]'
      notes: M11
    NMeAcOM:
      name: Methyl(acetoxymethyl)ammonium
      smiles: '[*:1][N+](C)(COC(C)=O)[*:2]'
      smarts: '[CH3][NX4+][CH2]OC(=O)[CH3]'
      notes: M13
    NDFM2:
      name: Bis(difluoromethyl)ammonium
      smiles: '[*:1][N+](C(F)F)(C(F)F)[*:2]'
      smarts: '[NX4+]([CH1](F)F)[CH1](F)F'
      notes: M14
    NH2:
      name: Secondary ammonium (N+H2)
      smiles: '[*:1][NH2+][*:2]'
      smarts: '[NX4+;H2]'
      notes: M17; protic, H-bond donor, pH-dependent
    OxoPyr:
      name: 2-Oxopyrrolidinium (lactam)
      smiles: '[*:1][N+]1([*:2])CCCC1=O'
      smarts: '[NX4+]1C(=O)[CH2][CH2][CH2]1'
      notes: M7; hypothetical (computed only)
    Phth:
      name: Phthalimidium
      smiles: '[*:1][N+]1([*:2])C(=O)c2ccccc2C1=O'
      smarts: '[NX4+]1C(=O)c2ccccc2C1=O'
      notes: M4; hypothetical (computed only)
    ImQ:
      name: 1,1-Disubstituted 1H-imidazolium (non-aromatic)
      smiles: '[*:1][N+]1([*:2])C=CN=C1'
      smarts: '[NX4+]1C=CN=C1'
      notes: M12; hypothetical (computed only)
  spacer:
    C1:
      name: Methylene, n=1
      smiles: '[*:1]C[*:2]'
      notes: carboxybetaine CB-1; benzyl linker of styrenic monomers
    C2:
      name: Ethylene, n=2
      smiles: '[*:1]CC[*:2]'
      notes: CBMA (CB-2), phosphorylcholine; O-CH2-CH2-N+ linker of ester monomers
    C3:
      name: Propylene, n=3
      smiles: '[*:1]CCC[*:2]'
      notes: standard sulfobetaine (propanesulfonate); NH-(CH2)3-N+ linker of amide monomers
    C4:
      name: Butylene, n=4
      smiles: '[*:1]CCCC[*:2]'
      notes: butanesulfonate (M3295)
    C3OH:
      name: 2-Hydroxypropylene
      smiles: '[*:1]CC(O)C[*:2]'
      notes: hydroxy-sulfobetaines; more hydrophilic
  anion:
    SO3:
      name: Sulfonate
      smiles: '[*:1]S(=O)(=O)[O-]'
      smarts: '[CX4]S(=O)(=O)[O-]'
      notes: sulfobetaines; strong acid, pH-independent
    OSO3:
      name: Sulfate
      smiles: '[*:1]OS(=O)(=O)[O-]'
      smarts: '[CX4]OS(=O)(=O)[O-]'
      notes: sulfabetaines
    COO:
      name: Carboxylate
      smiles: '[*:1]C(=O)[O-]'
      smarts: '[CX4]C(=O)[O-]'
      notes: carboxybetaines; protonates at low pH (pKa ~2-4.5)
    PO3H:
      name: Phosphonate (mono-anion)
      smiles: '[*:1]P(=O)(O)[O-]'
      smarts: '[CX4]P(=O)([OX2H1])[O-]'
      notes: the di-anion (-2) forms at high pH
    PO4i:
      name: Phosphate diester (internal)
      smiles: '[*:1]OP(=O)([O-])O[*:2]'
      smarts: '[CH2]OP(=O)([O-])O[CH2]'
      notes: 'inverted order: anion near backbone (MPC)'
    PO4t:
      name: Phosphate diester (terminal, methyl ester)
      smiles: '[*:1]OP(=O)([O-])OC'
      smarts: '[CX4]OP(=O)([O-])O[CH3]'
      notes: choline phosphate (CP); R = methyl here, other alkyls are reported
    NTf:
      name: Triflyl-sulfonylimide
      smiles: '[*:1][N-]S(=O)(=O)C(F)(F)F'
      smarts: '[CX4][N-]S(=O)(=O)C(F)(F)F'
      notes: from zwitterionic-liquid chemistry; delocalized, weakly coordinating
    ArO:
      name: Phenolate (on an aromatic ring)
      smiles: '[*:1][O-]'
      smarts: c[OX1-]
      notes: M1; pH-dependent (pKa ~8-10)
    ArCOO:
      name: Aryl carboxylate (on an aromatic ring)
      smiles: '[*:1]C(=O)[O-]'
      smarts: cC(=O)[O-]
      notes: M19; no spacer, the anion sits on the cation ring
