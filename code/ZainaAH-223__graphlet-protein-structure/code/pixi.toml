# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "graphlet-protein-structure"
description = "Alignment-free protein structure comparison using graphlets of residue contact networks"
authors = ["Zaina Alhemeiri <zaina.alhemeiri@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
biopython = ">=1.88,<2"
networkx = ">=3.7,<4"
numpy = ">=2.5.4,<3"
scikit-learn = ">=1.9.1,<2"
pyyaml = ">=6.0.3,<7"
cxx-compiler = ">=2.0.0,<3"

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
# The lessons replace this placeholder with real steps.
reproduce = { cmd = "python -c \"print('Nothing to reproduce yet: add your steps to the reproduce task in pixi.toml')\"", description = "Rebuild all results from raw data" }
download = { cmd = "python scripts/download.py", description = "Download raw data listed in metadata/sources.tsv" }
setup-orca = { cmd = "python scripts/setup_orca.py", description = "Download, compile and self-test ORCA (pinned commit)" }

[pypi-dependencies]
tmtools = ">=0.3.0, <0.4"
