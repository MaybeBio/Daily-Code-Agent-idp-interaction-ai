name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: python -m build

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/security-audit.mjs
      - run: pnpm run lint
      - run: pnpm run test

  research-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/generate_registry.py --output /tmp/v0.1-foldings-edge-registry.json --residues data/external/joined_residues.csv
      - run: python scripts/compare_registry.py reports/v0.1-foldings-edge-registry.json /tmp/v0.1-foldings-edge-registry.json
      - run: cmp reports/v0.1-foldings-edge-registry.json site/app/data/registry.json
