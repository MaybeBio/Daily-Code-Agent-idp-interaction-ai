[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foldings_edge"
version = "1.0.0"
description = "A reproducible reanalysis of AlphaFold2 pLDDT vs. DisProt-curated intrinsic disorder"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["alphafold", "disprot", "intrinsic-disorder", "structural-biology", "reproducible-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-requests>=2.31",
]

[project.scripts]
foldings-edge = "foldings_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foldings_edge"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=foldings_edge --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["foldings_edge"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
