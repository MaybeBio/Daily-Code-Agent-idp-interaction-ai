[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idrfeat"
version = "0.1.0"
description = "Feature extraction for intrinsically disordered regions, for fitness and variant-effect modeling"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Suhaan Thayyil" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15,<22",
    "pyyaml>=6,<7",
    "localcider>=0.1.21,<0.2",
    "metapredict>=3,<4",
]

# Optional, heavier scientific tools. The core library computes composition, charge, and
# disorder features from localCIDER and metapredict. Fold-on-binding, conservation, and the
# language-model features turn on when the matching extra is installed and its model is
# available. Low complexity uses the NCBI SEG binary (segmasker) when it is on PATH.
[project.optional-dependencies]
predictors = [
    "metapredict>=3,<4",
    "localcider>=0.1.21,<0.2",
]
binding = ["aiupred @ git+https://github.com/doszilab/AIUPred"]
conservation = ["pyBigWig>=0.3.22,<0.4"]
modeling = ["scikit-learn>=1.4,<2"]
interpret = ["shap>=0.44,<1"]
esm = ["fair-esm>=2,<3", "torch>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "black>=24,<26", "scikit-learn>=1.4,<2"]

[project.scripts]
idrfeat = "idrfeat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idrfeat"]

[tool.hatch.build.targets.wheel.force-include]
"src/idrfeat/data" = "idrfeat/data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
