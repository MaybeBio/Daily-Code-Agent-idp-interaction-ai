name: microllps
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - git
  - curl
  - pip:
      - numpy==2.5.3
      - pandas==3.0.5
      - scipy==1.18.1
      - scikit-learn==1.6.1      # pinned: required to unpickle the dG/c_sat models
      - statsmodels==0.15.0
      - matplotlib==3.11.2
      - joblib==1.6.0
      - biopython==1.88
      - MDAnalysis==2.10.0
      - numba==0.68.0
      - torch==2.14.1            # CPU build is sufficient
      - metapredict==3.1.1
      - afrc==0.3.7              # pinned: afrc>=0.4 breaks FINCHES 1.0 import
      - ./ext/finches            # FINCHES 1.0.0 installed from source (cloned by download_data.sh)
