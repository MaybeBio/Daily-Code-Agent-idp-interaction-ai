random_seeds: [42, 1234, 2023, 2024, 777, 888, 999, 1111, 2222, 3333]

split_seed: 42
val_ratio: 0.1
num_workers: 2

model:
  d_plm: 1024                      
  d2: 128                          
  scales: [1, 3, 4, 5, 8, 16, 32]  
  kernel_size: 5                   
  omega0: 6.0                       
  n_mamba: 3                        
  d_state: 16                       
  d_conv: 4
  expand: 2
  head_hidden: 256                 
  dropout: 0.1
  use_fused_kernel: true            

loss:
  gamma_pos: {disorder: 0, protein: 0, rna: 0, dna: 0}
  gamma_neg: {disorder: 2, protein: 2, rna: 3, dna: 3}
  init_sigma: 1.0                  

optim:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 32
  max_epochs: 100
  patience: 10                     
  grad_clip: 1.0

bootstrap:
  n_iter: 1000
  alpha: 0.05
