[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendna"
version = "0.6.0rc1"
description = "Protein property prediction from Python, driving the OpenDNA command-line tool"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenDNA contributors" }]
keywords = ["protein", "bioinformatics", "disorder", "solubility", "stability"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
# Nothing. The predictions come from the `opendna` binary, and pandas is only
# needed for `Run.frame`, which says so when it is missing. A package that
# pulled in a dataframe library to shell out to a binary would be imposing a
# dependency it does not use.
dependencies = []

[project.optional-dependencies]
frames = ["pandas>=2.0"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/dyber-pqc/OpenDNA"
Source = "https://github.com/dyber-pqc/OpenDNA/tree/main/bindings/python"

[tool.setuptools.packages.find]
include = ["opendna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
