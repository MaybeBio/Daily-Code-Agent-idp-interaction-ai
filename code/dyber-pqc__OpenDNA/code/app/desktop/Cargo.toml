[package]
name = "opendna-desktop"
description = "OpenDNA desktop application (Tauri backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "opendna_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opendna-core.workspace = true
opendna-io.workspace = true
opendna-analysis.workspace = true
opendna-store.workspace = true
opendna-ml.workspace = true
opendna-app-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Run predictions on the GPU. Off by default: a desktop build should not
# require a CUDA toolkit to compile.
cuda = ["opendna-ml/cuda"]
metal = ["opendna-ml/metal"]

[lints]
workspace = true
