[package]
name = "opendna-train"
description = "Builds embedding caches and trains the OpenDNA prediction heads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
opendna-ml = { path = "../../crates/opendna-ml", version = "0.6.0-rc1" }
opendna-core = { path = "../../crates/opendna-core", version = "0.6.0-rc1" }
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
csv = "1"
half = "2"
indicatif = "0.18"
parquet = "60"
arrow = "60"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
cuda = ["opendna-ml/cuda", "candle-core/cuda", "candle-nn/cuda"]
metal = ["opendna-ml/metal", "candle-core/metal", "candle-nn/metal"]

[lints]
workspace = true
