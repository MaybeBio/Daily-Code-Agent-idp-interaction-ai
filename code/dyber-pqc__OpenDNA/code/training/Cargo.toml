# Training tools. A separate workspace so the library crates and the desktop
# app do not pull in Arrow, Parquet or the CUDA toolchain.
[workspace]
resolver = "2"
members = ["opendna-train"]

[workspace.package]
version = "0.6.0-rc1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/dyber-pqc/OpenDNA"
authors = ["OpenDNA contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
