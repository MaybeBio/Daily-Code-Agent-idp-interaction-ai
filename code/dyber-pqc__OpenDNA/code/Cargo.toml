[workspace]
resolver = "2"
members = [
    "crates/opendna-core",
    "crates/opendna-io",
    "crates/opendna-analysis",
    "crates/opendna-store",
    "crates/opendna-engine",
    "crates/opendna-ml",
    "crates/opendna-hal",
    "crates/opendna-cli",
]
# No excludes: each other workspace (app, datasets, training) sits in its own
# directory and is not a member here.

[workspace.package]
version = "0.6.0-rc1"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/dyber-pqc/OpenDNA"
homepage = "https://github.com/dyber-pqc/OpenDNA"
authors = ["OpenDNA contributors"]

[workspace.dependencies]
opendna-core = { path = "crates/opendna-core", version = "0.6.0-rc1" }
opendna-io = { path = "crates/opendna-io", version = "0.6.0-rc1" }
opendna-analysis = { path = "crates/opendna-analysis", version = "0.6.0-rc1" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# dev-only
approx = "0.5"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric code converts between index and float types constantly; these lints
# add noise without catching real bugs in this domain.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
many_single_char_names = "allow"
# candle's constructors take VarBuilder by value; that is the framework's
# shape, not an oversight.
needless_pass_by_value = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
