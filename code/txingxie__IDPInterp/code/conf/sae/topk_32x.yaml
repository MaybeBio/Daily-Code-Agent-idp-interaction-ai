type: topk
expansion_factor: 32
k: 64
tag: k64          # disambiguates run_name across the L0 sweep
batch_size: 2048
lr: 5e-5
total_steps: 200000
checkpoint_every: 10000
log_every: 100
dead_feature_window: 5000
lr_warmup_frac: 0.05
# AuxK (Gao et al. 2024) revives dead features by having them reconstruct the
# residual — robust to isotropic embeddings where resampling fails (SeqDance).
aux_coeff: 0.03125      # 1/32, the published default
aux_k: 512
resample_dead: false    # AuxK replaces resampling; running both is counterproductive
resample_every: 25000
