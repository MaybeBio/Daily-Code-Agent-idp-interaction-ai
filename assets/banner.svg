<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="BioCode Agent —— 科研代码仓库自动追踪模板">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#121a35"/>
      <stop offset="100%" stop-color="#1b1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <circle cx="1080" cy="150" r="260" fill="url(#glow)"/>

  <!-- faint dot grid -->
  <g fill="#4c5a8a" opacity="0.18">
    <circle cx="60" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/><circle cx="180" cy="40" r="1.6"/><circle cx="240" cy="40" r="1.6"/><circle cx="300" cy="40" r="1.6"/><circle cx="360" cy="40" r="1.6"/><circle cx="420" cy="40" r="1.6"/>
    <circle cx="60" cy="260" r="1.6"/><circle cx="120" cy="260" r="1.6"/><circle cx="180" cy="260" r="1.6"/><circle cx="240" cy="260" r="1.6"/><circle cx="300" cy="260" r="1.6"/><circle cx="360" cy="260" r="1.6"/><circle cx="420" cy="260" r="1.6"/>
  </g>

  <!-- radar motif -->
  <g transform="translate(1040,150)" fill="none" stroke="url(#accent)" stroke-opacity="0.55">
    <circle r="46" stroke-width="2"/>
    <circle r="82" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle r="118" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke-opacity="0.25"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke-opacity="0.25"/>
    <path d="M0 0 L92 -74" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round"/>
  </g>
  <g transform="translate(1040,150)">
    <circle r="8" fill="#a78bfa"/>
    <circle cx="54" cy="-44" r="5" fill="#7dd3fc"/>
    <circle cx="-62" cy="30" r="5" fill="#67e8f9"/>
    <circle cx="34" cy="62" r="4" fill="#c4b5fd"/>
    <circle cx="-30" cy="-70" r="4" fill="#818cf8"/>
  </g>

  <!-- code brackets -->
  <text x="70" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="120" fill="#334166" opacity="0.5" font-weight="700">&lt;/&gt;</text>

  <text x="70" y="132" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="66" font-weight="800" fill="url(#titleGrad)">BioCode Agent</text>

  <text x="72" y="176" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600" fill="#8ea2d0">科研代码仓库自动追踪 · 打分 · Code Card · 静态站点</text>

  <text x="72" y="216" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#5f7099">GitHub Actions · GitHub 仓库发现 × LLM 精读 × Issue 周报 × Pages</text>

  <rect x="70" y="242" width="86" height="6" rx="3" fill="url(#accent)"/>
</svg>
